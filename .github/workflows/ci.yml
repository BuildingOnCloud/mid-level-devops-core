name: DevOps Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.11'
        cache: 'pip'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: Run Black Code Formatter Check
      run: |
        black --check app/src/

    - name: Run Flake8 Linter Audit
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 app/src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 app/src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
